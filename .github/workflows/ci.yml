name: CI — Validação por Commit

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apk:
    name: APK build (assembleDebug)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK (debug)
        run: gradle -p apps/android assembleDebug --no-daemon
      - name: APK existe
        run: test -f apps/android/app/build/outputs/apk/debug/app-debug.apk && ls -la apps/android/app/build/outputs/apk/debug/
      - uses: actions/upload-artifact@v4
        with:
          name: local-embed-keyboard-debug
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  tui:
    name: TUI smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: py_compile
        run: python3 -m py_compile apps/tui/tui.py
      - name: smoke (import + prompts)
        run: python3 apps/tui/tui.py --smoke
      - name: Prompts + models.json válidos
        run: |
          python3 - <<'PY'
          import glob, json, sys
          files = glob.glob('prompts/*.json') + ['models.json']
          for f in files:
              o = json.load(open(f, encoding='utf-8'))
          for f in glob.glob('prompts/*.json'):
              o = json.load(open(f, encoding='utf-8'))
              assert o.get('id') and o.get('name') and o.get('steps'), f
              for s in o['steps']:
                  assert s.get('template'), f
          m = json.load(open('models.json', encoding='utf-8'))
          assert all(x.get('id') and 'verified' in x for x in m['models']), 'models.json'
          print(f'OK: {len(files)} arquivos JSON válidos')
          PY

  docs:
    name: Docs links
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Links relativos de README/docs resolvem
        run: |
          python3 - <<'PY'
          import os, re, sys
          MD = re.compile(r'\[[^\]]*\]\(([^)]+)\)')
          broken = []
          for base in ['README.md'] + [os.path.join('docs', f) for f in os.listdir('docs') if f.endswith('.md')]:
              for link in MD.findall(open(base, encoding='utf-8').read()):
                  if link.startswith(('http', '#', 'mailto')): continue
                  p = link.split('#')[0]
                  if not p: continue
                  cand = os.path.normpath(os.path.join(os.path.dirname(base), p))
                  if not os.path.exists(cand): broken.append((base, link))
          if broken:
              for b in broken: print('QUEBRA:', b)
              sys.exit(1)
          print('OK: links relativos resolvidos')
          PY

  workflows:
    name: Workflows YAML
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
      - name: Workflows YAML parseiam
        run: |
          pip install -q pyyaml
          python3 - <<'PY'
          import glob, yaml
          for f in glob.glob('.github/workflows/*.yml'):
              yaml.safe_load(open(f))
          print('OK: YAMLs parseiam')
          PY
