name: CD — Release por tag

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: APK + Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK (debug; assinatura fica no débito TODO)
        run: gradle -p apps/android assembleDebug --no-daemon
      - name: Release com APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp apps/android/app/build/outputs/apk/debug/app-debug.apk local-embed-keyboard-${GITHUB_REF_NAME}.apk
          gh release create "${GITHUB_REF_NAME}" \
            --title "local-embeding ${GITHUB_REF_NAME}" \
            --generate-notes \
            "local-embed-keyboard-${GITHUB_REF_NAME}.apk"
